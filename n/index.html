<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>A shared note · Sermon Bible</title><style>:root{--paper:#F4F5F2;--surface:#fff;--ink:#17233B;--soft:#5E6B7E;--line:#DFE1DC;--ribbon:#9C2A2A;--gilt:#85631F;--wash:#F2E9D2}@media (prefers-color-scheme:dark){:root{--paper:#101826;--surface:#182233;--ink:#E9ECF1;--soft:#A3ADBC;--line:#2A3548;--ribbon:#E06A61;--gilt:#D2A852;--wash:#3A3020}}*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}::selection{background:var(--wash)}main{max-width:640px;margin:0 auto;padding:40px 20px 72px}.brand{display:flex;align-items:center;gap:10px;font:600 15px/1 -apple-system,system-ui,sans-serif;color:var(--ink);text-decoration:none}.mark{width:12px;height:28px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}h1{font-size:34px;line-height:1.2;margin:28px 0 6px;letter-spacing:-.01em}.meta{font:15px/1.5 -apple-system,system-ui,sans-serif;color:var(--soft);margin:0 0 24px}h2{font:600 13px/1.4 -apple-system,system-ui,sans-serif;color:var(--soft);margin:32px 0 6px}h3{font-size:20px;margin:22px 0 6px}.verse{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}.ref{font:600 13px/1.4 -apple-system,system-ui,sans-serif;color:var(--gilt);margin-top:8px}.cta{display:block;text-decoration:none;margin:36px 0 0;padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font:15px/1.5 -apple-system,system-ui,sans-serif;color:var(--soft)}.cta b{color:var(--ink)}a{color:var(--ribbon);text-underline-offset:3px}.note{color:var(--soft);font:15px/1.5 -apple-system,system-ui,sans-serif}</style></head><body><main>
<a class="brand" href="/"><span class="mark"></span>Sermon Bible</a>
<div id="note"><p class="meta">Opening the note…</p></div>
<a class="cta" href="/"><b>Shared from Sermon Bible.</b> Sermon notes with the whole Bible built in.</a>
</main>
<script>
(function () {
  var API = 'https://ikodacuycgwtspdzibri.supabase.co/functions/v1/shared-note';
  var KEY = 'sb_publishable_GDBzq_F5gTfLKgURe7rYZQ_FsLEVQQE';
  var el = document.getElementById('note');
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function inline(s) { return esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/_([^_\n]+)_/g, '<em>$1</em>'); }
  // The same Markdown the app writes: headings, bullet and numbered lists, bold and italic.
  function md(text) {
    var out = [], list = null, para = [];
    function flush() { if (para.length) out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; }
    function close() { if (list) out.push('</' + list + '>'); list = null; }
    String(text || '').split('\n').forEach(function (raw) {
      var line = raw.replace(/\s+$/, ''), h = /^#{1,3} (.*)$/.exec(line), b = /^\s*[-*•] (.*)$/.exec(line), n = /^\s*\d+\. (.*)$/.exec(line);
      if (!line.trim()) { flush(); close(); }
      else if (h) { flush(); close(); out.push('<h3>' + inline(h[1]) + '</h3>'); }
      else if (b || n) { flush(); var want = b ? 'ul' : 'ol'; if (list !== want) { close(); out.push('<' + want + '>'); list = want; } out.push('<li>' + inline((b || n)[1]) + '</li>'); }
      else { close(); para.push(line); }
    });
    flush(); close();
    return out.join('');
  }
  function section(label, text) { return text && String(text).trim() ? '<h2>' + esc(label) + '</h2>' + md(text) : ''; }
  function list(label, items) { return items && items.length ? '<h2>' + esc(label) + '</h2><ul>' + items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>' : ''; }
  var token = (/[?&]t=([A-Za-z0-9_-]{24,64})/.exec(location.search) || [])[1];
  if (!token) { el.innerHTML = '<h1>This link isn’t complete</h1><p class="meta">Ask the person who shared it to send it again.</p>'; return; }
  fetch(API + '?t=' + token, { headers: { apikey: KEY } })
    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
    .then(function (res) {
      if (!res.ok || !res.body.note) { el.innerHTML = '<h1>This note can’t be opened</h1><p class="meta">' + esc(res.body.error || 'Try again in a moment.') + '</p>'; return; }
      var n = res.body.note;
      document.title = (n.title || 'A shared note') + ' · Sermon Bible';
      var date = n.date ? new Date(n.date + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '';
      var meta = [date, [n.speaker, n.church].filter(Boolean).join(', '), n.series].filter(Boolean).map(esc).join(' · ');
      var verses = (n.verses || []).map(function (v) { return '<div class="verse">' + esc(v.text).replace(/\[([^\]]+)\]/g, '<em>$1</em>') + '<div class="ref">' + esc(v.ref) + ' · ' + esc(v.version) + '</div></div>'; }).join('');
      var s = n.summary;
      el.innerHTML = '<h1>' + esc(n.title || 'Untitled note') + '</h1><p class="meta">' + meta + '</p>' + verses +
        section('Notes', n.body) + section('Key points', n.keyPoints) +
        (s ? section('Summary', s.overview) + list('To apply', s.application) + list('For discussion', s.questions) : '') +
        section('Takeaways', n.takeaways) + section('Prayer', n.prayer);
    })
    .catch(function () { el.innerHTML = '<h1>This note can’t be opened</h1><p class="meta">Check your internet connection and try again.</p>'; });
})();
</script></body></html>
